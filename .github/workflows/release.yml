name: Build Release Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to publish (e.g. v1.2.0): builds that tag's sources with this workflow and attaches the installers to its release. Leave blank for a trial build."
        required: false
        default: ""
      app_version:
        description: "Trial builds only: app version for jpackage (X.Y.Z). Leave blank to use the pom.xml version."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    # Per-job timeout caps the Intel macOS job at 60 min so a scarce
    # Intel-runner queue can't hold the release open forever. The fast jobs
    # finish in <15 min.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    # If one platform fails, the others still publish; re-run just the failed
    # job from the workflow page.
    continue-on-error: ${{ matrix.continue_on_error }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            jdk_arch: x64
            package_type: EXE
            asset_name: X-Men.exe
            artifact_glob: target/dist/*.exe
            timeout_minutes: 45
            continue_on_error: false
          # Intel-Mac .dmg on a native x86_64 runner. GitHub retired the
          # macos-14 images on 2026-11-02; macos-15-intel is the Intel label
          # (supported until August 2027).
          - os: macos-15-intel
            arch: x64
            macho_arch: x86_64
            jdk_arch: x64
            javafx_classifier: mac
            package_type: DMG
            asset_name: X-Men-x64.dmg
            artifact_glob: target/dist/*.dmg
            timeout_minutes: 60
            continue_on_error: false
          # Apple Silicon .dmg: the previous matrix entry omitted `architecture`,
          # so setup-java defaulted to x64 and installed an x86_64 JDK on the
          # arm64 runner. jpackage then produced an x86_64 launcher labelled as
          # "arm64" — on a real Apple-Silicon Mac without Rosetta 2 that launcher
          # silently fails to start, which was the "app isn't starting" report.
          # Pinning aarch64 here makes the build truly native.
          - os: macos-15
            arch: arm64
            macho_arch: arm64
            jdk_arch: aarch64
            javafx_classifier: mac-aarch64
            package_type: DMG
            asset_name: X-Men-arm64.dmg
            artifact_glob: target/dist/*.dmg
            timeout_minutes: 45
            continue_on_error: false
          - os: ubuntu-latest
            jdk_arch: x64
            package_type: DEB
            asset_name: X-Men.deb
            artifact_glob: target/dist/*.deb
            timeout_minutes: 30
            continue_on_error: false

    steps:
      # A manual run with release_tag builds that tag's sources; otherwise
      # the commit that triggered the run.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          architecture: ${{ matrix.jdk_arch }}
          cache: maven

      # Bundle JDK 21 on every platform so local, CI, and packaged builds
      # compile against the same JavaFX-compatible runtime line.

      - name: Make Maven wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./mvnw

      # The repo ships a pre-built .icns generated from the master logo, but
      # regenerate it on the macOS runner with the OS-native `iconutil` so the
      # produced .icns always matches the Apple-recommended layout (one-time
      # cost; the rest of the build does not care).
      - name: Refresh macOS app icon via iconutil
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          iconset=target/x-men.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" src/main/resources/packaging/x-men-icon.png --out "$iconset/icon_${size}x${size}.png"
            sips -z "$((size * 2))" "$((size * 2))" src/main/resources/packaging/x-men-icon.png --out "$iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$iconset" -o src/main/resources/packaging/x-men-icon.icns

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      # The pom.xml version is the single source of truth. A release tag must
      # name the same version, so the installers never carry a stale number.
      # Outputs: version (always) and tag (set only when publishing).
      - name: Resolve app version
        id: appver
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          APP_VERSION_INPUT: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          pom_version="$(./mvnw -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout | tail -n 1)"
          tag="${RELEASE_TAG:-}"
          if [[ -z "$tag" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ -n "$tag" ]]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid release tag '$tag' (expected vX.Y.Z)"
              exit 1
            fi
            v="${tag#v}"
            if [[ "$v" != "$pom_version" ]]; then
              echo "::error::Tag $tag does not match the pom.xml version ${pom_version}"
              exit 1
            fi
          else
            v="${APP_VERSION_INPUT:-$pom_version}"
          fi
          if [[ ! "$v" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Invalid app version '$v' (expected X.Y.Z)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using app version: $v${tag:+ (publishing to $tag)}"

      # Single-step build for every platform. The architecture pin in
      # setup-java above is what makes the Apple-Silicon launcher boot:
      # jpackage already ad-hoc signs the .app bundle by default, so a
      # separate codesign + repackage pass is unnecessary and was the
      # source of the x64 .dmg build instability.
      - name: Build installer
        shell: bash
        run: |
          ./mvnw -B -ntp -P installer \
            -Djpackage.type=${{ matrix.package_type }} \
            -Djpackage.appVersion=${{ steps.appver.outputs.version }} \
            -DskipTests \
            clean package

      - name: Verify macOS app architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(ls target/dist/*.dmg)"
          mount_dir="$(mktemp -d)"
          hdiutil attach "$dmg" -mountpoint "$mount_dir" -nobrowse -quiet
          trap 'hdiutil detach "$mount_dir" -quiet || true' EXIT
          app="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          file "$app/Contents/MacOS/X-Men"
          file "$app/Contents/MacOS/X-Men" | grep -q "${{ matrix.macho_arch }}"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          echo "CFBundleShortVersionString: $bundle_version"
          test "$bundle_version" = "${{ steps.appver.outputs.version }}"
          jar_file="$(ls "$app"/Contents/app/X-Men_2.1-*.jar)"
          jar tf "$jar_file" | grep -q "javafx-graphics-.*-${{ matrix.javafx_classifier }}\\.jar"
          if [ "${{ matrix.javafx_classifier }}" = "mac-aarch64" ]; then
            ! jar tf "$jar_file" | grep -q "javafx-graphics-[0-9].*-mac\\.jar"
          else
            ! jar tf "$jar_file" | grep -q "javafx-graphics-.*-mac-aarch64\\.jar"
          fi

      - name: Verify Linux package version and media dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb="$(ls target/dist/*.deb)"
          deb_version="$(dpkg-deb -f "$deb" Version)"
          echo "Package version: $deb_version"
          test "${deb_version%-*}" = "${{ steps.appver.outputs.version }}"
          depends="$(dpkg-deb -f "$deb" Depends)"
          echo "$depends"
          grep -q "libglib2.0-0" <<< "$depends"
          grep -Eq "libavcodec[0-9]+|libavcodec-extra[0-9]+" <<< "$depends"
          grep -Eq "libavformat[0-9]+" <<< "$depends"

      - name: Normalize asset name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          matches=( ${{ matrix.artifact_glob }} )
          if [ ${#matches[@]} -ne 1 ]; then
            echo "Expected exactly one installer matching '${{ matrix.artifact_glob }}', found ${#matches[@]}"
            ls -R target/dist || true
            printf '%s\n' "${matches[@]}"
            exit 1
          fi
          cp "${matches[0]}" "release-assets/${{ matrix.asset_name }}"
          ls -la release-assets

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: release-assets/${{ matrix.asset_name }}
          if-no-files-found: error

      - name: Upload GitHub Release asset
        uses: softprops/action-gh-release@v3
        if: steps.appver.outputs.tag != ''
        with:
          tag_name: ${{ steps.appver.outputs.tag }}
          files: release-assets/${{ matrix.asset_name }}
